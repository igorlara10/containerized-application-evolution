<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Cadastro de Usuário</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: #0f0f0f;
      color: #ffffff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .container {
      background-color: #1c1c1c;
      padding: 30px;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 4px;
      border: none;
      font-size: 14px;
    }

    input::placeholder {
      color: #999;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #4caf50;
      border: none;
      border-radius: 4px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #43a047;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .success {
      color: #4caf50;
    }

    .error {
      color: #f44336;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Cadastro de Usuário</h1>

    <label for="name">Nome</label>
    <input type="text" id="name" placeholder="Digite seu nome" />

    <label for="cpf">CPF</label>
    <input type="text" id="cpf" placeholder="Somente números" />

    <button onclick="saveUser()">Salvar</button>

    <div id="message" class="message"></div>
  </div>

  <script>
    async function saveUser() {
      const name = document.getElementById("name").value.trim();
      const cpf = document.getElementById("cpf").value.trim();
      const message = document.getElementById("message");

      message.textContent = "";
      message.className = "message";

      if (!name || !cpf) {
        message.textContent = "Preencha todos os campos.";
        message.classList.add("error");
        return;
      }

      try {
        const response = await fetch("/api/users", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ name, cpf })
        });

        if (response.ok) {
          message.textContent = "Cadastro realizado com sucesso!";
          message.classList.add("success");
          document.getElementById("name").value = "";
          document.getElementById("cpf").value = "";
        } else {
          message.textContent = "Erro ao realizar cadastro.";
          message.classList.add("error");
        }
      } catch (error) {
        message.textContent = "Erro de conexão com o servidor.";
        message.classList.add("error");
      }
    }
  </script>

</body>
</html>
